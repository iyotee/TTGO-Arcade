; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ttgo-t-display          ; plain 'pio run' builds and uploads over USB

[env:ttgo-t-display]
platform = espressif32@6.9.0
board = esp32dev
; two 1.9 MB app slots for OTA updates; NVS stays at 0x9000 (scores and settings survive).
; Changing the partition table needs one USB upload; OTA updates work after that.
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
build_flags = 
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D CGRAM_OFFSET=1
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=16
	-D TFT_RST=23
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000
	; NimBLE (Bluetooth): one peripheral role only, small host footprint
	-D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-D CONFIG_BT_NIMBLE_MAX_BONDS=4
	-D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=5120
	; crash reports: keep the faulting PC and backtrace across the reset (crashrec.cpp)
	-Wl,--wrap=esp_panic_handler
	-D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	h2zero/NimBLE-Arduino@~1.4.3
	ricmoo/QRCode@^0.0.1
; the heavy games live in the cartridge (env:cartridge), not in the launcher.
; FW_BUILD (cart.h) is 0 unless the CI passes PLATFORMIO_BUILD_FLAGS=-DFW_BUILD=<n>.
build_src_filter =
	+<*>
	-<abyx*.cpp>
	-<crypt*.cpp>
	-<cartmain.cpp>

; "Big Games" cartridge: the heavy games plus the shared code they need, no
; launcher menu, no WiFi / Bluetooth. Built by the CI (fw/cartridge.bin) and
; installed from the launcher into its other app slot (WiFi download, or the
; companion page over Bluetooth). Never upload it over USB: it would replace
; the launcher.
[env:cartridge]
extends = env:ttgo-t-display
build_flags =
	${env:ttgo-t-display.build_flags}
	-D TTGO_CARTRIDGE=1
build_src_filter =
	-<*>
	+<abyx*.cpp>
	+<crypt*.cpp>
	+<cartmain.cpp>
	+<cart.cpp>
	+<ui_common.cpp>
	+<theme.cpp>
	+<tigo.cpp>
	+<power.cpp>
	+<diag.cpp>
	+<crashrec.cpp>
	+<saver.cpp>
	+<lockscr.cpp>
	+<clock.cpp>
upload_protocol = custom
upload_command = "$PYTHONEXE" -c "import sys; sys.exit('The cartridge installs from the launcher (Games > Abyx), not over USB')"

; Wireless update: open Settings > OTA update on the board, then
;   pio run -e ota -t upload
[env:ota]
extends = env:ttgo-t-display
upload_protocol = espota
upload_port = ttgo-arcade.local        ; or the IP shown on the OTA screen
upload_flags =
	--port=3232
