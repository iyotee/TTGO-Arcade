; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-t-display]
platform = espressif32@6.9.0
board = esp32dev
board_build.partitions = huge_app.csv   ; 3 MB app, no OTA (WiFi + BLE need the room)
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
build_flags = 
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D CGRAM_OFFSET=1
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=16
	-D TFT_RST=23
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000
	; NimBLE (Bluetooth): one peripheral role only, small host footprint
	-D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-D CONFIG_BT_NIMBLE_MAX_BONDS=4
	-D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	h2zero/NimBLE-Arduino@~1.4.3
